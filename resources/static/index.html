<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C++ WebSocket Terminal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Username Popup Overlay -->
    <div id="nameOverlay" class="name-overlay">
        <div class="name-popup">
            <h2>Welcome</h2>
            <p>Enter your name to start chatting</p>
            <input type="text" id="nameInput" placeholder="Your name..." autocomplete="off">
            <button id="nameBtn" onclick="submitName()">Connect</button>
        </div>
    </div>

    <div class="chat-container">
        <header>
            <div class="status-indicator" id="statusCircle"></div>
            <h1>C++ Server Console</h1>
        </header>

        <div id="chat-box" class="chat-box"></div>

        <div class="input-area">
            <input type="text" id="msgInput" placeholder="Type a message..." autocomplete="off" disabled>
            <button id="actionBtn" onclick="sendMessage()">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                </svg>
            </button>
        </div>
    </div>

    <script>
        let ws;
        let username = '';
        const chatBox = document.getElementById("chat-box");
        const msgInput = document.getElementById("msgInput");
        const statusCircle = document.getElementById("statusCircle");
        const nameOverlay = document.getElementById("nameOverlay");
        const nameInput = document.getElementById("nameInput");

        // Enter key on name input
        nameInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") submitName();
        });

        function submitName() {
            const name = nameInput.value.trim();
            if (!name) return;
            username = name;
            nameOverlay.style.display = "none";
            initiateWebSocket();
        }

        function initiateWebSocket() {
            // Pass the username as a query param so the server knows who this is
            ws = new WebSocket("ws://" + window.location.host + "/chat?name=" + encodeURIComponent(username));

            ws.onopen = () => {
                statusCircle.style.background = "#00ff88";
                msgInput.disabled = false;
                msgInput.focus();
                appendMessage("System", "Connected as " + username, "system-msg");
            };

            ws.onmessage = (event) => {
                // Server sends JSON: { "from": "admin", "message": "hello" }
                try {
                    const data = JSON.parse(event.data);
                    const sender = data.from || "Server";
                    const text = data.message || event.data;
                    appendMessage(sender, text, "server-msg");
                } catch (e) {
                    // Fallback: display raw text if not JSON
                    appendMessage("Server", event.data, "server-msg");
                }
            };

            ws.onclose = () => {
                statusCircle.style.background = "#ff4444";
                msgInput.disabled = true;
                appendMessage("System", "Connection terminated.", "system-msg");
            };
        }

        function sendMessage() {
            const text = msgInput.value.trim();
            if (text && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(text);
                appendMessage("You", text, "user-msg");
                msgInput.value = "";
            }
        }

        function appendMessage(sender, text, className) {
            const msgDiv = document.createElement("div");
            msgDiv.className = `message-wrapper ${className}`;
            msgDiv.innerHTML = `
                <div class="message-content">
                    <small>${sender}</small>
                    <p>${text}</p>
                </div>
            `;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
        }

        msgInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendMessage();
        });
    </script>
</body>

</html>
