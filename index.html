<!DOCTYPE html>
<html>
<head>
    <title>C++ WebSocket Chat</title>
    <style>
        body { font-family: sans-serif; background: #f0f0f0; display: flex; flex-direction: column; align-items: center; }
        #chat-box { width: 400px; height: 300px; background: white; border: 1px solid #ccc; overflow-y: scroll; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        .controls { display: flex; gap: 5px; }
        input { padding: 8px; width: 300px; }
        button { padding: 8px 15px; background: #007bff; color: white; border: none; cursor: pointer; border-radius: 3px; }
        button:hover { background: #0056b3; }
        .server-msg { color: blue; }
        .user-msg { color: green; font-weight: bold; }
    </style>
</head>
<body>
    <h2>C++ WebSocket Chat</h2>
    <div id="chat-box"></div>
    <div class="controls">
        <input type="text" id="msgInput" placeholder="Type a message...">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        // Connect to C++ server
        const ws = new WebSocket("ws://localhost:8082");
        const chatBox = document.getElementById("chat-box");
        const msgInput = document.getElementById("msgInput");

        ws.onopen = () => {
            appendMessage("System", "Connected to C++ Server", "system");
        };

        ws.onmessage = (event) => {
            appendMessage("Server", event.data, "server-msg");
        };

        ws.onclose = () => {
            appendMessage("System", "Disconnected from Server", "system");
        };

        function sendMessage() {
            const text = msgInput.value;
            if (text && ws.readyState === WebSocket.OPEN) {
                ws.send(text);
                appendMessage("You", text, "user-msg");
                msgInput.value = "";
            }
        }

        function appendMessage(sender, text, className) {
            const div = document.createElement("div");
            div.className = className;
            div.innerHTML = `<strong>${sender}:</strong> ${text}`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight; // Auto-scroll
        }

        // Allow pressing "Enter" to send
        msgInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendMessage();
        });
    </script>
</body>
</html>
